734,106 736,114 L 736,164 L 742,170 L 736,176 L 736,180 Q 736,190 726,190"/><text x="718" y="146" fill="#6B7280" dominant-baseline="central" font-size="12" font-weight="600" text-anchor="end">×8 组</text><text x="718" y="162" fill="#9CA3AF" dominant-baseline="central" font-size="10" text-anchor="end">8 head : 1 KV</text><line x1="60" x2="740" y1="220" y2="220" stroke="#E5E7EB" stroke-width="1"/><text x="60" y="244" fill="#374151" dominant-baseline="central" font-size="13" font-weight="700">每个 token 每层 KV Cache 存储（fp16 / bf16，2 bytes / element）</text><rect width="680" height="78" x="60" y="258" fill="#FAFBFC" stroke="#E5E7EB" stroke-width="1" rx="8"/><text x="80" y="284" fill="#F97316" class="mono" dominant-baseline="central" font-size="14" font-weight="600">K:</text><text x="105" y="284" fill="#374151" dominant-baseline="central" font-size="14"><tspan class="mono">8 heads</tspan> <tspan fill="#9CA3AF" font-size="13"> × </tspan> <tspan class="mono">128 dim</tspan> <tspan fill="#9CA3AF" font-size="13"> × </tspan> <tspan class="mono">2 B</tspan> <tspan fill="#9CA3AF" font-size="13"> = </tspan> <tspan class="mono" font-weight="600">2,048 B</tspan> <tspan fill="#9CA3AF" font-size="13"> = </tspan> <tspan fill="#F97316" class="mono" font-weight="700">2 KB</tspan></text><text x="80" y="312" fill="#22C55E" class="mono" dominant-baseline="central" font-size="14" font-weight="600">V:</text><text x="105" y="312" fill="#374151" dominant-baseline="central" font-size="14"><tspan class="mono">8 heads</tspan> <tspan fill="#9CA3AF" font-size="13"> × </tspan> <tspan class="mono">128 dim</tspan> <tspan fill="#9CA3AF" font-size="13"> × </tspan> <tspan class="mono">2 B</tspan> <tspan fill="#9CA3AF" font-size="13"> = </tspan> <tspan class="mono" font-weight="600">2,048 B</tspan> <tspan fill="#9CA3AF" font-size="13"> = </tspan> <tspan fill="#22C55E" class="mono" font-weight="700">2 KB</tspan></text><rect width="430" height="34" x="60" y="352" fill="#FAFBFC" stroke="#E5E7EB" stroke-width="1" rx="8"/><text x="80" y="369" fill="#374151" dominant-baseline="central" font-size="13"><tspan fill="#F97316" font-weight="600">K</tspan> <tspan> + </tspan> <tspan fill="#22C55E" font-weight="600">V</tspan> <tspan> = 2 KB + 2 KB = </tspan> <tspan class="mono" font-weight="700">4 KB / token / layer</tspan></text><rect width="230" height="34" x="510" y="352" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5" filter="url(#badge-shadow)" rx="8"/><text x="625" y="369" fill="#1F2937" dominant-baseline="central" font-size="15" font-weight="700" text-anchor="middle">合计：4 KB / token / layer</text><rect width="230" height="22" x="510" y="396" fill="#FEF3C7" rx="6"/><text x="625" y="407" fill="#D97706" dominant-baseline="central" font-size="11" font-weight="600" text-anchor="middle">仅为 MHA 的 1/8</text><text x="400" y="462" fill="#9CA3AF" dominant-baseline="central" font-size="11" text-anchor="middle">注：LLaMA-2 70B 实际配置。num_kv_heads = 8，num_q_heads / num_kv_heads = 8:1。数值可由 kv_cache_calc.py 复现。</text></svg>