<svg xmlns="http://www.w3.org/2000/svg" width="880" height="580" viewBox="0 0 880 580"><defs><filter id="card-shadow" width="104%" height="104%" x="-2%" y="-2%"><feDropShadow dx="0" dy="2" flood-color="#000" flood-opacity=".06" stdDeviation="4"/></filter><filter id="badge-shadow" width="110%" height="120%" x="-5%" y="-5%"><feDropShadow dx="0" dy="1" flood-color="#000" flood-opacity=".08" stdDeviation="2"/></filter><style>text{font-family:&apos;PingFang SC&apos;,&apos;Noto Sans SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif}.mono{font-family:&apos;Courier New&apos;,&apos;SF Mono&apos;,&apos;Menlo&apos;,monospace}</style></defs><rect width="848" height="556" x="16" y="12" fill="#FFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#card-shadow)" rx="12"/><text x="440" y="46" fill="#1F2937" dominant-baseline="central" font-size="22" font-weight="700" text-anchor="middle">MLA（多头潜在注意力）</text><text x="440" y="74" fill="#6B7280" dominant-baseline="central" font-size="13" text-anchor="middle">压缩 head 维度：不存完整 K/V，只存一个压缩后的 latent vector · DeepSeek-V2/V3</text><rect width="180" height="40" x="180" y="104" fill="#FFF7ED" stroke="#F97316" stroke-dasharray="4 3" stroke-width="1.5" rx="6"/><text x="270" y="118" fill="#F97316" dominant-baseline="central" font-size="12" font-weight="700" text-anchor="middle">原始 K：128 heads × 128 dim</text><text x="270" y="134" fill="#9CA3AF" dominant-baseline="central" font-size="11" text-anchor="middle">= 16,384 fp16 = 32 KB</text><rect width="180" height="40" x="440" y="104" fill="#F0FDF4" stroke="#22C55E" stroke-dasharray="4 3" stroke-width="1.5" rx="6"/><text x="530" y="118" fill="#22C55E" dominant-baseline="central" font-size="12" font-weight="700" text-anchor="middle">原始 V：128 heads × 128 dim</text><text x="530" y="134" fill="#9CA3AF" dominant-baseline="central" font-size="11" text-anchor="middle">= 16,384 fp16 = 32 KB</text><text x="370" y="118" fill="#DC2626" dominant-baseline="central" font-size="18" font-weight="700">✗</text><text x="630" y="118" fill="#DC2626" dominant-baseline="central" font-size="18" font-weight="700">✗</text><text x="400" y="161" fill="#DC2626" dominant-baseline="central" font-size="11" font-weight="600" text-anchor="middle">不占用 KV Cache（不存储原始 K/V）</text><line x1="270" x2="270" y1="144" y2="174" stroke="#9CA3AF" stroke-width="1.2"/><line x1="530" x2="530" y1="144" y2="174" stroke="#9CA3AF" stroke-width="1.2"/><line x1="270" x2="396" y1="174" y2="182" stroke="#9CA3AF" stroke-width="1.2"/><line x1="530" x2="404" y1="174" y2="182" stroke="#9CA3AF" stroke-width="1.2"/><polygon fill="#9CA3AF" points="396 186 400 192 404 186"/><text x="650" y="174" fill="#6B7280" dominant-baseline="central" font-size="11" text-anchor="start"><tspan fill="#7C3AED" font-family="'Courier New','SF Mono','Menlo',monospace" font-weight="600">W^{DKV}</tspan> <tspan> 下投影：128×128 → 512</tspan></text><rect width="230" height="48" x="285" y="196" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2" rx="8"/><text x="400" y="214" fill="#7C3AED" dominant-baseline="central" font-size="13" font-weight="700" text-anchor="middle">KV latent = (512,)</text><text x="400" y="232" fill="#6B7280" dominant-baseline="central" font-size="11" text-anchor="middle">= 512 fp16 = 1 KB</text><text x="525" y="223" fill="#22C55E" font-size="16" font-weight="700">✓ 存储</text><line x1="400" x2="400" y1="244" y2="268" stroke="#9CA3AF" stroke-width="1.2"/><line x1="400" x2="270" y1="268" y2="278" stroke="#9CA3AF" stroke-width="1.2"/><line x1="400" x2="530" y1="268" y2="278" stroke="#9CA3AF" stroke-width="1.2"/><text x="650" y="261" fill="#6B7280" dominant-baseline="central" font-size="11" text-anchor="start"><tspan fill="#7C3AED" font-family="'Courier New','SF Mono','Menlo',monospace" font-weight="600">W^{UK}</tspan> <tspan>, </tspan> <tspan fill="#7C3AED" font-family="'Courier New','SF Mono','Menlo',monospace" font-weight="600">W^{UV}</tspan> <tspan> 上投影还原</tspan></text><text x="650" y="275" fill="#9CA3AF" dominant-baseline="central" font-size="10" text-anchor="start">注意力计算时实时执行，不额外占用 KV Cache</text><rect width="180" height="36" x="180" y="284" fill="#FFF7ED" stroke="#F97316" stroke-dasharray="4 3" stroke-width="1.5" rx="6"/><text x="270" y="302" fill="#F97316" dominant-baseline="central" font-size="11" text-anchor="middle">还原 K（实时计算）</text><rect width="180" height="36" x="440" y="284" fill="#F0FDF4" stroke="#22C55E" stroke-dasharray="4 3" stroke-width="1.5" rx="6"/><text x="530" y="302" fill="#22C55E" dominant-baseline="central" font-size="11" text-anchor="middle">还原 V（实时计算）</text><line x1="520" x2="740" y1="205" y2="205" stroke="#F97316" stroke-dasharray="3 3" stroke-width="1.5"/><text x="630" y="199" fill="#F97316" dominant-baseline="central" font-size="9" font-weight="600" text-anchor="middle">RoPE 解耦</text><rect width="60" height="36" x="740" y="192" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5" rx="6"/><text x="770" y="210" fill="#F97316" dominant-baseline="central" font-size="10" font-weight="600" text-anchor="middle">RoPE</text><rect width="190" height="72" x="650" y="284" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5" rx="8"/><text x="745" y="300" fill="#F97316" dominant-baseline="central" font-size="11" font-weight="700" text-anchor="middle">Decoupled RoPE K (共享)</text><text x="745" y="318" fill="#374151" dominant-baseline="central" font-size="11" text-anchor="middle"><tspan class="mono">64 dim</tspan> <tspan fill="#9CA3AF" font-size="10"> (所有 head 共享)</tspan></text><text x="745" y="338" fill="#6B7280" dominant-baseline="central" font-size="11" text-anchor="middle">= 64 fp16 = 128 B</text><text x="843" y="320" fill="#22C55E" font-size="14" font-weight="700">✓</text><text x="745" y="370" fill="#9CA3AF" dominant-baseline="central" font-size="10" text-anchor="middle">RoPE 旋转变换不可压缩，必须单独存储</text><line x1="60" x2="820" y1="400" y2="400" stroke="#E5E7EB" stroke-width="1"/><text x="60" y="422" fill="#374151" dominant-baseline="central" font-size="13" font-weight="700">每个 token 每层 KV Cache 存储（MLA，fp16 / bf16）</text><rect width="760" height="60" x="60" y="436" fill="#FAFBFC" stroke="#E5E7EB" stroke-width="1" rx="8"/><text x="80" y="457" fill="#374151" dominant-baseline="central" font-size="13"><tspan fill="#7C3AED" font-weight="600">KV latent</tspan> <tspan>：512 dim × 2 B = </tspan> <tspan class="mono" font-weight="700">1,024 B = 1 KB</tspan> <tspan> ┐</tspan></text><text x="80" y="480" fill="#374151" dominant-baseline="central" font-size="13"><tspan fill="#F97316" font-weight="600">Decoupled RoPE K</tspan> <tspan>：64 dim × 2 B = </tspan> <tspan class="mono" font-weight="700">128 B</tspan> <tspan> (共享于所有 head) ┘</tspan></text><rect width="430" height="34" x="60" y="508" fill="#FAFBFC" stroke="#E5E7EB" stroke-width="1" rx="8"/><text x="80" y="525" fill="#374151" dominant-baseline="central" font-size="13"><tspan fill="#7C3AED" font-weight="600">latent</tspan> <tspan> + </tspan> <tspan fill="#F97316" font-weight="600">RoPE K</tspan> <tspan> = 1 KB + 128 B ≈ </tspan> <tspan class="mono" font-weight="700">1.13 KB / token / layer</tspan></text><rect width="230" height="34" x="590" y="508" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5" filter="url(#badge-shadow)" rx="8"/><text x="705" y="525" fill="#1F2937" dominant-baseline="central" font-size="15" font-weight="700" text-anchor="middle">合计：~1.13 KB / token / layer</text><text x="440" y="555" fill="#9CA3AF" dominant-baseline="central" font-size="11" text-anchor="middle">注：DeepSeek-V3 实际配置。K 和 V 共享一个下投影矩阵 W^{DKV}，但 RoPE 因旋转操作不可压缩，需解耦单独存储。</text></svg>