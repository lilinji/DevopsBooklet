<svg xmlns="http://www.w3.org/2000/svg" width="800" height="608" viewBox="0 0 800 608"><defs><filter id="card-shadow" width="104%" height="104%" x="-2%" y="-2%"><feDropShadow dx="0" dy="2" flood-color="#000" flood-opacity=".06" stdDeviation="4"/></filter><filter id="badge-shadow" width="110%" height="120%" x="-5%" y="-5%"><feDropShadow dx="0" dy="1" flood-color="#000" flood-opacity=".08" stdDeviation="2"/></filter><style>text{font-family:&apos;PingFang SC&apos;,&apos;Noto Sans SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif}.mono{font-family:&apos;Courier New&apos;,&apos;SF Mono&apos;,&apos;Menlo&apos;,monospace}</style></defs><rect width="768" height="584" x="16" y="12" fill="#FFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#card-shadow)" rx="12"/><text x="400" y="46" fill="#1F2937" dominant-baseline="central" font-size="22" font-weight="700" text-anchor="middle">CSA / HCA（压缩稀疏注意力 / 混合压缩注意力）</text><text x="400" y="74" fill="#6B7280" dominant-baseline="central" font-size="13" text-anchor="middle">压缩 token 维度：把连续多个 token 的 KV 合并为一个 · DeepSeek-V4</text><rect width="680" height="80" x="60" y="94" fill="#FAFBFC" stroke="#E5E7EB" stroke-width="1" rx="8"/><text x="80" y="114" fill="#374151" dominant-baseline="central" font-size="13" font-weight="700">c4a（30 层）：每 8 token → 1 个压缩 token，步长 4（有效 4:1）</text><g dominant-baseline="central" text-anchor="middle"><rect width="36" height="20" x="80" y="128" fill="#E5E7EB" rx="4"/><text x="98" y="139" fill="#6B7280" font-size="10">t₀</text><rect width="36" height="20" x="120" y="128" fill="#E5E7EB" rx="4"/><text x="138" y="139" fill="#6B7280" font-size="10">t₁</text><rect width="36" height="20" x="160" y="128" fill="#E5E7EB" rx="4"/><text x="178" y="139" fill="#6B7280" font-size="10">t₂</text><text x="202" y="139" fill="#9CA3AF" font-size="11">···</text><rect width="36" height="20" x="220" y="128" fill="#E5E7EB" rx="4"/><text x="238" y="139" fill="#6B7280" font-size="10">t₇</text><rect width="36" height="20" x="280" y="128" fill="#E5E7EB" rx="4"/><text x="298" y="139" fill="#6B7280" font-size="10">t₄</text><rect width="36" height="20" x="320" y="128" fill="#E5E7EB" rx="4"/><text x="338" y="139" fill="#6B7280" font-size="10">t₅</text><text x="362" y="139" fill="#9CA3AF" font-size="11">···</text><rect width="36" height="20" x="380" y="128" fill="#E5E7EB" rx="4"/><text x="398" y="139" fill="#6B7280" font-size="10">t₁₁</text><text x="440" y="139" fill="#9CA3AF" font-size="13">···</text></g><path fill="none" stroke="#6B7280" stroke-dasharray="3 2" stroke-width="1" d="M 74,125 L 74,162 L 262,162 L 262,125"/><path fill="none" stroke="#6B7280" stroke-dasharray="3 2" stroke-width="1" d="M 274,125 L 274,162 L 422,162 L 422,125"/><line x1="168" x2="168" y1="152" y2="165" stroke="#6B7280" stroke-width="1"/><polygon fill="#6B7280" points="164 165 168 170 172 165"/><text x="178" y="158" fill="#6B7280" dominant-baseline="central" font-size="9" text-anchor="start">8 token → 1</text><line x1="348" x2="348" y1="152" y2="165" stroke="#6B7280" stroke-width="1"/><polygon fill="#6B7280" points="344 165 348 170 352 165"/><rect width="48" height="20" x="144" y="170" fill="#D1D5DB" rx="4"/><text x="168" y="181" fill="#374151" dominant-baseline="central" font-size="10" font-weight="600" text-anchor="middle">c₀</text><rect width="48" height="20" x="324" y="170" fill="#D1D5DB" rx="4"/><text x="348" y="181" fill="#374151" dominant-baseline="central" font-size="10" font-weight="600" text-anchor="middle">c₁</text><rect width="680" height="80" x="60" y="198" fill="#FAFBFC" stroke="#E5E7EB" stroke-width="1" rx="8"/><text x="80" y="218" fill="#374151" dominant-baseline="central" font-size="13" font-weight="700">c128a（31 层）：每 128 token → 1 个压缩 token（无重叠，128:1）</text><g dominant-baseline="central" text-anchor="middle"><rect width="36" height="20" x="80" y="232" fill="#E5E7EB" rx="4"/><text x="98" y="243" fill="#6B7280" font-size="10">t₀</text><rect width="36" height="20" x="120" y="232" fill="#E5E7EB" rx="4"/><text x="138" y="243" fill="#6B7280" font-size="10">t₁</text><text x="172" y="243" fill="#9CA3AF" font-size="11">···</text><rect width="36" height="20" x="200" y="232" fill="#E5E7EB" rx="4"/><text x="218" y="243" fill="#6B7280" font-size="10">t₁₂₆</text><rect width="36" height="20" x="240" y="232" fill="#E5E7EB" rx="4"/><text x="258" y="243" fill="#6B7280" font-size="10">t₁₂₇</text><rect width="36" height="20" x="310" y="232" fill="#E5E7EB" rx="4"/><text x="328" y="243" fill="#6B7280" font-size="10">t₁₂₈</text><text x="362" y="243" fill="#9CA3AF" font-size="11">···</text><rect width="36" height="20" x="390" y="232" fill="#E5E7EB" rx="4"/><text x="408" y="243" fill="#6B7280" font-size="10">t₂₅₅</text><text x="450" y="243" fill="#9CA3AF" font-size="13">···</text></g><path fill="none" stroke="#6B7280" stroke-dasharray="3 2" stroke-width="1" d="M 74,229 L 74,276 L 282,276 L 282,229"/><path fill="none" stroke="#6B7280" stroke-dasharray="3 2" stroke-width="1" d="M 304,229 L 304,276 L 432,276 L 432,229"/><line x1="178" x2="178" y1="256" y2="269" stroke="#6B7280" stroke-width="1"/><polygon fill="#6B7280" points="174 269 178 274 182 269"/><text x="188" y="267" fill="#6B7280" dominant-baseline="central" font-size="9" text-anchor="start">128 token → 1</text><line x1="368" x2="368" y1="256" y2="269" stroke="#6B7280" stroke-width="1"/><polygon fill="#6B7280" points="364 269 368 274 372 269"/><rect width="48" height="20" x="154" y="274" fill="#9CA3AF" rx="4"/><text x="178" y="285" fill="#FFF" dominant-baseline="central" font-size="10" font-weight="600" text-anchor="middle">c₀</text><rect width="48" height="20" x="344" y="274" fill="#9CA3AF" rx="4"/><text x="368" y="285" fill="#FFF" dominant-baseline="central" font-size="10" font-weight="600" text-anchor="middle">c₁</text><rect width="680" height="44" x="60" y="296" fill="#F0FDF4" stroke="#22C55E" stroke-width="1" rx="8"/><text x="80" y="314" fill="#374151" dominant-baseline="central" font-size="12" font-weight="600">所有 61 层均附带 128-token Sliding Window（局部窗口，不压缩）</text><text x="80" y="330" fill="#6B7280" dominant-baseline="central" font-size="11">每层最近的 128 个 token 保持未压缩状态，确保局部细节不丢失</text><rect width="322" height="52" x="60" y="354" fill="#EBF3FE" stroke="#BFDBFE" stroke-width="1" rx="8"/><text x="80" y="374" fill="#1D4ED8" dominant-baseline="central" font-size="12" font-weight="700">V4 61 层混合策略</text><text x="80" y="394" fill="#374151" dominant-baseline="central" font-size="11">30 层 c4a (4:1) + 31 层 c128a (128:1) + 全部 128 SWA</text><rect width="322" height="52" x="418" y="354" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1" rx="8"/><text x="438" y="374" fill="#D97706" dominant-baseline="central" font-size="12" font-weight="700">1M context 全模型 KV Cache</text><text x="438" y="394" fill="#374151" dominant-baseline="central" font-size="13"><tspan fill="#D97706" class="mono" font-weight="700">~9.62 GiB</tspan> <tspan>（bf16） / </tspan> <tspan fill="#D97706" class="mono" font-weight="700">~5 GB</tspan> <tspan>（FP8+FP4）</tspan></text><line x1="60" x2="740" y1="422" y2="422" stroke="#E5E7EB" stroke-width="1"/><text x="60" y="444" fill="#374151" dominant-baseline="central" font-size="13" font-weight="700">单 token 等效 KV 对比（1M context，bf16）</text><rect width="680" height="62" x="60" y="458" fill="#FAFBFC" stroke="#E5E7EB" stroke-width="1" rx="8"/><text x="80" y="478" fill="#374151" dominant-baseline="central" font-size="12"><tspan fill="#9CA3AF" font-weight="600">c4a 等效：</tspan> <tspan class="mono" font-weight="700">~18 B / token</tspan> <tspan> (0.018 KB)</tspan> <tspan> </tspan> <tspan fill="#9CA3AF" font-weight="600">c128a 等效：</tspan> <tspan class="mono" font-weight="700">~0.5 B / token</tspan> <tspan> (0.0005 KB)</tspan></text><text x="80" y="498" fill="#374151" dominant-baseline="central" font-size="12"><tspan fill="#9CA3AF" font-weight="600">加权平均：</tspan> <tspan class="mono" font-weight="700">~169 B / token ≈ 0.17 KB</tspan> <tspan>（30 层 c4a + 31 层 c128a）</tspan></text><rect width="430" height="34" x="60" y="536" fill="#FAFBFC" stroke="#E5E7EB" stroke-width="1" rx="8"/><text x="80" y="553" fill="#374151" dominant-baseline="central" font-size="13"><tspan>vs MLA 的 ~1.1 KB → </tspan> <tspan fill="#D97706" class="mono" font-weight="700">再缩减 ~6.5×</tspan> <tspan>（加权平均 ~0.17 KB vs ~1.1 KB）</tspan></text><rect width="230" height="34" x="510" y="536" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5" filter="url(#badge-shadow)" rx="8"/><text x="625" y="553" fill="#1F2937" dominant-baseline="central" font-size="15" font-weight="700" text-anchor="middle">合计：~0.17 KB / token / layer</text><text x="400" y="583" fill="#9CA3AF" dominant-baseline="central" font-size="11" text-anchor="middle">注：DeepSeek-V4 实测数据（vLLM 博客）。c4a 步长 4 导致 2× 冗余，有效压缩比为 4:1。数值可由 kv_cache_calc.py 复现。</text></svg>