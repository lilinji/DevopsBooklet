<svg xmlns="http://www.w3.org/2000/svg" width="800" height="510" viewBox="0 0 800 510"><defs><filter id="card-shadow" width="104%" height="104%" x="-2%" y="-2%"><feDropShadow dx="0" dy="2" flood-color="#000" flood-opacity=".06" stdDeviation="4"/></filter><filter id="badge-shadow" width="110%" height="120%" x="-5%" y="-5%"><feDropShadow dx="0" dy="1" flood-color="#000" flood-opacity=".08" stdDeviation="2"/></filter><style>text{font-family:&apos;PingFang SC&apos;,&apos;Noto Sans SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif}.mono{font-family:&apos;Courier New&apos;,&apos;SF Mono&apos;,&apos;Menlo&apos;,monospace}</style></defs><rect width="768" height="486" x="16" y="12" fill="#FFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#card-shadow)" rx="12"/><text x="400" y="46" fill="#1F2937" dominant-baseline="central" font-size="22" font-weight="700" text-anchor="middle">MQA（多查询注意力）</text><text x="400" y="74" fill="#6B7280" dominant-baseline="central" font-size="13" text-anchor="middle">32 Q heads → 1 KV head · 多对一共享 · num_kv_heads = 1（GQA 的极端情况）</text><rect width="480" height="66" x="120" y="100" fill="#EBF3FE" stroke="#BFDBFE" stroke-width="1.5" rx="10"/><text x="360" y="114" fill="#6B7280" dominant-baseline="central" font-size="10" text-anchor="middle">32 个 Q head — 全部共享同一组 KV</text><g dominant-baseline="central"><rect width="10" height="10" x="160" y="124" fill="#3B82F6" rx="2"/><rect width="10" height="10" x="174" y="124" fill="#3B82F6" rx="2"/><rect width="10" height="10" x="188" y="124" fill="#3B82F6" rx="2"/><rect width="10" height="10" x="202" y="124" fill="#3B82F6" rx="2"/><rect width="10" height="10" x="216" y="124" fill="#3B82F6" rx="2"/><text x="232" y="130" fill="#9CA3AF" font-size="13">···</text><rect width="10" height="10" x="250" y="124" fill="#3B82F6" rx="2"/><rect width="10" height="10" x="264" y="124" fill="#3B82F6" rx="2"/><rect width="10" height="10" x="278" y="124" fill="#3B82F6" rx="2"/><rect width="10" height="10" x="230" y="138" fill="#3B82F6" rx="2"/><rect width="10" height="10" x="244" y="138" fill="#3B82F6" rx="2"/><rect width="10" height="10" x="258" y="138" fill="#3B82F6" rx="2"/><rect width="10" height="10" x="272" y="138" fill="#3B82F6" rx="2"/><rect width="10" height="10" x="286" y="138" fill="#3B82F6" rx="2"/><text x="302" y="144" fill="#9CA3AF" font-size="13">···</text><rect width="10" height="10" x="320" y="138" fill="#3B82F6" rx="2"/><rect width="10" height="10" x="334" y="138" fill="#3B82F6" rx="2"/><rect width="10" height="10" x="348" y="138" fill="#3B82F6" rx="2"/><text x="310" y="156" fill="#9CA3AF" font-size="12">···</text><rect width="10" height="10" x="340" y="152" fill="#3B82F6" rx="2"/><text x="358" y="158" fill="#6B7280" font-size="10">Q₃₁</text></g><line x1="240" x2="240" y1="166" y2="178" stroke="#9CA3AF" stroke-width="1"/><line x1="360" x2="360" y1="166" y2="178" stroke="#9CA3AF" stroke-width="1"/><line x1="480" x2="480" y1="166" y2="178" stroke="#9CA3AF" stroke-width="1"/><line x1="240" x2="356" y1="178" y2="186" stroke="#9CA3AF" stroke-width="1"/><line x1="480" x2="364" y1="178" y2="186" stroke="#9CA3AF" stroke-width="1"/><line x1="360" x2="360" y1="178" y2="186" stroke="#9CA3AF" stroke-width="1.2"/><polygon fill="#9CA3AF" points="356 190 360 196 364 190"/><rect width="110" height="24" x="305" y="196" fill="#FFF" stroke="#D1D5DB" stroke-width="1" rx="5"/><rect width="55" height="24" x="305" y="196" fill="#F97316" rx="5"/><rect width="2" height="24" x="358" y="196" fill="#FFF"/><rect width="55" height="24" x="360" y="196" fill="#22C55E" rx="5"/><rect width="2" height="24" x="358" y="196" fill="#F97316"/><text x="332" y="208" fill="#FFF" dominant-baseline="central" font-size="11" font-weight="600" text-anchor="middle">K₀</text><text x="387" y="208" fill="#FFF" dominant-baseline="central" font-size="11" font-weight="600" text-anchor="middle">V₀</text><text x="24" y="122" fill="#3B82F6" dominant-baseline="central" font-size="12" font-weight="600">Q<tspan fill="#9CA3AF" font-size="10" font-weight="400">（不缓存）</tspan></text><text x="24" y="208" fill="#F97316" dominant-baseline="central" font-size="12" font-weight="600">K / V<tspan fill="#9CA3AF" font-size="10" font-weight="400">（缓存）</tspan></text><path fill="none" stroke="#9CA3AF" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M 726,106 Q 734,106 736,114 L 736,164 L 742,170 L 736,176 L 736,202 Q 736,212 726,212"/><text x="718" y="158" fill="#6B7280" dominant-baseline="central" font-size="12" font-weight="600" text-anchor="end">×1 组</text><text x="718" y="174" fill="#9CA3AF" dominant-baseline="central" font-size="10" text-anchor="end">32 head : 1 KV</text><line x1="60" x2="740" y1="244" y2="244" stroke="#E5E7EB" stroke-width="1"/><text x="60" y="268" fill="#374151" dominant-baseline="central" font-size="13" font-weight="700">每个 token 每层 KV Cache 存储（fp16 / bf16，2 bytes / element）</text><rect width="680" height="78" x="60" y="282" fill="#FAFBFC" stroke="#E5E7EB" stroke-width="1" rx="8"/><text x="80" y="308" fill="#F97316" class="mono" dominant-baseline="central" font-size="14" font-weight="600">K:</text><text x="105" y="308" fill="#374151" dominant-baseline="central" font-size="14"><tspan class="mono">1 head</tspan> <tspan fill="#9CA3AF" font-size="13"> × </tspan> <tspan class="mono">128 dim</tspan> <tspan fill="#9CA3AF" font-size="13"> × </tspan> <tspan class="mono">2 B</tspan> <tspan fill="#9CA3AF" font-size="13"> = </tspan> <tspan class="mono" font-weight="600">256 B</tspan></text><text x="80" y="336" fill="#22C55E" class="mono" dominant-baseline="central" font-size="14" font-weight="600">V:</text><text x="105" y="336" fill="#374151" dominant-baseline="central" font-size="14"><tspan class="mono">1 head</tspan> <tspan fill="#9CA3AF" font-size="13"> × </tspan> <tspan class="mono">128 dim</tspan> <tspan fill="#9CA3AF" font-size="13"> × </tspan> <tspan class="mono">2 B</tspan> <tspan fill="#9CA3AF" font-size="13"> = </tspan> <tspan class="mono" font-weight="600">256 B</tspan></text><rect width="430" height="34" x="60" y="376" fill="#FAFBFC" stroke="#E5E7EB" stroke-width="1" rx="8"/><text x="80" y="393" fill="#374151" dominant-baseline="central" font-size="13"><tspan fill="#F97316" font-weight="600">K</tspan> <tspan> + </tspan> <tspan fill="#22C55E" font-weight="600">V</tspan> <tspan> = 256 B + 256 B = </tspan> <tspan class="mono" font-weight="700">512 B = 0.5 KB / token / layer</tspan></text><rect width="230" height="34" x="510" y="376" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5" filter="url(#badge-shadow)" rx="8"/><text x="625" y="393" fill="#1F2937" dominant-baseline="central" font-size="15" font-weight="700" text-anchor="middle">合计：0.5 KB / token / layer</text><rect width="230" height="22" x="510" y="420" fill="#FEF3C7" rx="6"/><text x="625" y="431" fill="#D97706" dominant-baseline="central" font-size="11" font-weight="600" text-anchor="middle">仅为 MHA 的 1/64</text><rect width="200" height="22" x="60" y="420" fill="#FEE2E2" rx="6"/><text x="160" y="431" fill="#DC2626" dominant-baseline="central" font-size="10" font-weight="600" text-anchor="middle">代价：注意力质量下降</text><text x="400" y="470" fill="#9CA3AF" dominant-baseline="central" font-size="11" text-anchor="middle">注：假设配置。仅 1 组 KV 意味着所有 Q head 从同一视角观察输入，表达能力受限。PaLM、Falcon 使用过 MQA，现已基本被 GQA 取代。</text></svg>