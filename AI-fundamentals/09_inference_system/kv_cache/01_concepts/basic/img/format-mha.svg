，2 bytes / element）</text><rect width="680" height="78" x="60" y="292" fill="#FAFBFC" stroke="#E5E7EB" stroke-width="1" rx="8"/><text x="80" y="318" fill="#F97316" class="mono" dominant-baseline="central" font-size="14" font-weight="600">K:</text><text x="105" y="318" fill="#374151" dominant-baseline="central" font-size="14"><tspan class="mono">64 heads</tspan> <tspan fill="#9CA3AF" font-size="13"> × </tspan> <tspan class="mono">128 dim</tspan> <tspan fill="#9CA3AF" font-size="13"> × </tspan> <tspan class="mono">2 B</tspan> <tspan fill="#9CA3AF" font-size="13"> = </tspan> <tspan class="mono" font-weight="600">16,384 B</tspan> <tspan fill="#9CA3AF" font-size="13"> = </tspan> <tspan fill="#F97316" class="mono" font-weight="700">16 KB</tspan></text><text x="80" y="346" fill="#22C55E" class="mono" dominant-baseline="central" font-size="14" font-weight="600">V:</text><text x="105" y="346" fill="#374151" dominant-baseline="central" font-size="14"><tspan class="mono">64 heads</tspan> <tspan fill="#9CA3AF" font-size="13"> × </tspan> <tspan class="mono">128 dim</tspan> <tspan fill="#9CA3AF" font-size="13"> × </tspan> <tspan class="mono">2 B</tspan> <tspan fill="#9CA3AF" font-size="13"> = </tspan> <tspan class="mono" font-weight="600">16,384 B</tspan> <tspan fill="#9CA3AF" font-size="13"> = </tspan> <tspan fill="#22C55E" class="mono" font-weight="700">16 KB</tspan></text><rect width="430" height="34" x="60" y="386" fill="#FAFBFC" stroke="#E5E7EB" stroke-width="1" rx="8"/><text x="80" y="403" fill="#374151" dominant-baseline="central" font-size="13"><tspan fill="#F97316" font-weight="600">K</tspan> <tspan> + </tspan> <tspan fill="#22C55E" font-weight="600">V</tspan> <tspan> = 16 KB + 16 KB = </tspan> <tspan class="mono" font-weight="700">32 KB / token / layer</tspan></text><rect width="230" height="34" x="510" y="386" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5" filter="url(#badge-shadow)" rx="8"/><text x="625" y="403" fill="#1F2937" dominant-baseline="central" font-size="15" font-weight="700" text-anchor="middle">合计：32 KB / token / layer</text><text x="400" y="462" fill="#9CA3AF" dominant-baseline="central" font-size="11" text-anchor="middle">注：LLaMA-2 70B 假设配置（实际使用 GQA，num_kv_heads=8）。数值可由 kv_cache_calc.py 复现。</text></svg>