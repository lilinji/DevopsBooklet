<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700"><defs><linearGradient id="timelineGradient" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" style="stop-color:#e0e0e0;stop-opacity:1"/><stop offset="100%" style="stop-color:#f5f5f5;stop-opacity:1"/></linearGradient><linearGradient id="task1Gradient" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" style="stop-color:#4caf50;stop-opacity:1"/><stop offset="100%" style="stop-color:#81c784;stop-opacity:1"/></linearGradient><linearGradient id="task2Gradient" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" style="stop-color:#2196f3;stop-opacity:1"/><stop offset="100%" style="stop-color:#64b5f6;stop-opacity:1"/></linearGradient><linearGradient id="task3Gradient" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" style="stop-color:#ff9800;stop-opacity:1"/><stop offset="100%" style="stop-color:#ffb74d;stop-opacity:1"/></linearGradient><linearGradient id="contextGradient" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" style="stop-color:#f44336;stop-opacity:1"/><stop offset="100%" style="stop-color:#ef5350;stop-opacity:1"/></linearGradient><marker id="arrowhead" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="#333" points="0 0 10 3.5 0 7"/></marker></defs><text x="500" y="30" fill="#333" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle">GPU时间片调度机制</text><g><rect width="800" height="40" x="100" y="70" fill="url(#timelineGradient)" stroke="#333" stroke-width="1" rx="5"/><text x="500" y="95" fill="#333" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">时间轴 (Time Axis)</text><g><line x1="150" x2="150" y1="70" y2="110" stroke="#333" stroke-width="1"/><text x="150" y="125" fill="#333" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">0ms</text><line x1="250" x2="250" y1="70" y2="110" stroke="#333" stroke-width="1"/><text x="250" y="125" fill="#333" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">10ms</text><line x1="350" x2="350" y1="70" y2="110" stroke="#333" stroke-width="1"/><text x="350" y="125" fill="#333" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">20ms</text><line x1="450" x2="450" y1="70" y2="110" stroke="#333" stroke-width="1"/><text x="450" y="125" fill="#333" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">30ms</text><line x1="550" x2="550" y1="70" y2="110" stroke="#333" stroke-width="1"/><text x="550" y="125" fill="#333" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">40ms</text><line x1="650" x2="650" y1="70" y2="110" stroke="#333" stroke-width="1"/><text x="650" y="125" fill="#333" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">50ms</text><line x1="750" x2="750" y1="70" y2="110" stroke="#333" stroke-width="1"/><text x="750" y="125" fill="#333" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">60ms</text><line x1="850" x2="850" y1="70" y2="110" stroke="#333" stroke-width="1"/><text x="850" y="125" fill="#333" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">70ms</text></g></g><g><text x="50" y="170" fill="#333" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">GPU执行</text><rect width="80" height="30" x="150" y="150" fill="url(#task1Gradient)" stroke="#4CAF50" stroke-width="2" rx="4"/><text x="190" y="170" fill="#fff" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">任务A</text><rect width="20" height="30" x="230" y="150" fill="url(#contextGradient)" stroke="#F44336" stroke-width="1" rx="2"/><text x="240" y="200" fill="#F44336" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">切换</text><rect width="80" height="30" x="250" y="150" fill="url(#task2Gradient)" stroke="#2196F3" stroke-width="2" rx="4"/><text x="290" y="170" fill="#fff" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">任务B</text><rect width="20" height="30" x="330" y="150" fill="url(#contextGradient)" stroke="#F44336" stroke-width="1" rx="2"/><text x="340" y="200" fill="#F44336" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">切换</text><rect width="80" height="30" x="350" y="150" fill="url(#task3Gradient)" stroke="#FF9800" stroke-width="2" rx="4"/><text x="390" y="170" fill="#fff" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">任务C</text><rect width="20" height="30" x="430" y="150" fill="url(#contextGradient)" stroke="#F44336" stroke-width="1" rx="2"/><text x="440" y="200" fill="#F44336" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">切换</text><rect width="80" height="30" x="450" y="150" fill="url(#task1Gradient)" stroke="#4CAF50" stroke-width="2" rx="4"/><text x="490" y="170" fill="#fff" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">任务A</text><rect width="20" height="30" x="530" y="150" fill="url(#contextGradient)" stroke="#F44336" stroke-width="1" rx="2"/><text x="540" y="200" fill="#F44336" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">切换</text><rect width="80" height="30" x="550" y="150" fill="url(#task2Gradient)" stroke="#2196F3" stroke-width="2" rx="4"/><text x="590" y="170" fill="#fff" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">任务B</text><rect width="20" height="30" x="630" y="150" fill="url(#contextGradient)" stroke="#F44336" stroke-width="1" rx="2"/><text x="640" y="200" fill="#F44336" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">切换</text><rect width="80" height="30" x="650" y="150" fill="url(#task3Gradient)" stroke="#FF9800" stroke-width="2" rx="4"/><text x="690" y="170" fill="#fff" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">任务C</text><rect width="20" height="30" x="730" y="150" fill="url(#contextGradient)" stroke="#F44336" stroke-width="1" rx="2"/><text x="740" y="200" fill="#F44336" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">切换</text><rect width="80" height="30" x="750" y="150" fill="url(#task1Gradient)" stroke="#4CAF50" stroke-width="2" rx="4"/><text x="790" y="170" fill="#fff" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">任务A</text></g><g><text x="500" y="250" fill="#333" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">任务队列状态</text><rect width="250" height="120" x="100" y="270" fill="#E8F5E8" stroke="#4CAF50" stroke-width="2" rx="8"/><text x="225" y="295" fill="#2E7D32" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">就绪队列 (Ready Queue)</text><rect width="60" height="25" x="120" y="310" fill="#4CAF50" stroke="#388E3C" rx="4"/><text x="150" y="327" fill="#fff" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">任务A</text><rect width="60" height="25" x="190" y="310" fill="#2196F3" stroke="#1976D2" rx="4"/><text x="220" y="327" fill="#fff" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">任务B</text><rect width="60" height="25" x="260" y="310" fill="#FF9800" stroke="#F57C00" rx="4"/><text x="290" y="327" fill="#fff" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">任务C</text><text x="120" y="355" fill="#333" font-family="Arial, sans-serif" font-size="10">• 优先级：高 → 中 → 低</text><text x="120" y="370" fill="#333" font-family="Arial, sans-serif" font-size="10">• 时间片：8ms/10ms/8ms</text><rect width="250" height="120" x="375" y="270" fill="#E3F2FD" stroke="#2196F3" stroke-width="2" rx="8"/><text x="500" y="295" fill="#1565C0" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">运行状态 (Running)</text><rect width="100" height="40" x="450" y="320" fill="#2196F3" stroke="#1976D2" stroke-width="2" rx="6"/><text x="500" y="345" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">当前执行任务</text><text x="385" y="375" fill="#333" font-family="Arial, sans-serif" font-size="10">• 剩余时间片：3ms</text><rect width="250" height="120" x="650" y="270" fill="#FFF3E0" stroke="#FF9800" stroke-width="2" rx="8"/><text x="775" y="295" fill="#E65100" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">等待队列 (Waiting)</text><rect width="60" height="25" x="670" y="310" fill="#9E9E9E" stroke="#757575" rx="4"/><text x="700" y="327" fill="#fff" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">任务D</text><rect width="60" height="25" x="740" y="310" fill="#9E9E9E" stroke="#757575" rx="4"/><text x="770" y="327" fill="#fff" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">任务E</text><rect width="60" height="25" x="810" y="310" fill="#9E9E9E" stroke="#757575" rx="4"/><text x="840" y="327" fill="#fff" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">任务F</text><text x="660" y="355" fill="#333" font-family="Arial, sans-serif" font-size="10">• 等待I/O完成</text><text x="660" y="370" fill="#333" font-family="Arial, sans-serif" font-size="10">• 等待内存分配</text></g><g><text x="500" y="430" fill="#333" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">调度算法类型</text><rect width="180" height="100" x="100" y="450" fill="#F1F8E9" stroke="#4CAF50" stroke-width="2" rx="8"/><text x="190" y="475" fill="#2E7D32" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">轮转调度 (RR)</text><text x="110" y="495" fill="#333" font-family="Arial, sans-serif" font-size="10">• 固定时间片</text><text x="110" y="510" fill="#333" font-family="Arial, sans-serif" font-size="10">• 公平分配</text><text x="110" y="525" fill="#333" font-family="Arial, sans-serif" font-size="10">• 响应时间均匀</text><text x="110" y="540" fill="#333" font-family="Arial, sans-serif" font-size="10">• 适合交互式任务</text><rect width="180" height="100" x="300" y="450" fill="#E8F4FD" stroke="#2196F3" stroke-width="2" rx="8"/><text x="390" y="475" fill="#1565C0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">优先级调度 (Priority)</text><text x="310" y="495" fill="#333" font-family="Arial, sans-serif" font-size="10">• 动态优先级</text><text x="310" y="510" fill="#333" font-family="Arial, sans-serif" font-size="10">• 抢占式调度</text><text x="310" y="525" fill="#333" font-family="Arial, sans-serif" font-size="10">• 实时性保证</text><text x="310" y="540" fill="#333" font-family="Arial, sans-serif" font-size="10">• 适合关键任务</text><rect width="180" height="100" x="500" y="450" fill="#FFF8E1" stroke="#FF9800" stroke-width="2" rx="8"/><text x="590" y="475" fill="#E65100" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">多级反馈队列 (MLFQ)</text><text x="510" y="495" fill="#333" font-family="Arial, sans-serif" font-size="10">• 多个优先级队列</text><text x="510" y="510" fill="#333" font-family="Arial, sans-serif" font-size="10">• 动态调整优先级</text><text x="510" y="525" fill="#333" font-family="Arial, sans-serif" font-size="10">• 自适应时间片</text><text x="510" y="540" fill="#333" font-family="Arial, sans-serif" font-size="10">• 综合性能最优</text><rect width="180" height="100" x="700" y="450" fill="#FCE4EC" stroke="#E91E63" stroke-width="2" rx="8"/><text x="790" y="475" fill="#AD1457" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">公平共享调度 (CFS)</text><text x="710" y="495" fill="#333" font-family="Arial, sans-serif" font-size="10">• 虚拟运行时间</text><text x="710" y="510" fill="#333" font-family="Arial, sans-serif" font-size="10">• 红黑树调度</text><text x="710" y="525" fill="#333" font-family="Arial, sans-serif" font-size="10">• 长期公平性</text><text x="710" y="540" fill="#333" font-family="Arial, sans-serif" font-size="10">• 适合多用户环境</text></g><g><text x="500" y="590" fill="#333" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">关键性能指标</text><rect width="200" height="60" x="100" y="610" fill="#E8F5E8" stroke="#4CAF50" stroke-width="1" rx="5"/><text x="200" y="630" fill="#2E7D32" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">上下文切换开销</text><text x="110" y="650" fill="#333" font-family="Arial, sans-serif" font-size="10">• 寄存器保存/恢复：~50μs</text><text x="110" y="665" fill="#333" font-family="Arial, sans-serif" font-size="10">• 内存状态同步：~100μs</text><rect width="200" height="60" x="320" y="610" fill="#E3F2FD" stroke="#2196F3" stroke-width="1" rx="5"/><text x="420" y="630" fill="#1565C0" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">调度延迟</text><text x="330" y="650" fill="#333" font-family="Arial, sans-serif" font-size="10">• 平均响应时间：~2ms</text><text x="330" y="665" fill="#333" font-family="Arial, sans-serif" font-size="10">• 最大调度延迟：~10ms</text><rect width="200" height="60" x="540" y="610" fill="#FFF3E0" stroke="#FF9800" stroke-width="1" rx="5"/><text x="640" y="630" fill="#E65100" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">吞吐量</text><text x="550" y="650" fill="#333" font-family="Arial, sans-serif" font-size="10">• GPU利用率：85-95%</text><text x="550" y="665" fill="#333" font-family="Arial, sans-serif" font-size="10">• 任务完成率：提升30%</text><rect width="140" height="60" x="760" y="610" fill="#FCE4EC" stroke="#E91E63" stroke-width="1" rx="5"/><text x="830" y="630" fill="#AD1457" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">公平性</text><text x="770" y="650" fill="#333" font-family="Arial, sans-serif" font-size="10">• 资源分配均衡</text><text x="770" y="665" fill="#333" font-family="Arial, sans-serif" font-size="10">• 饥饿避免机制</text></g></svg>