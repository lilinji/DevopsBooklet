r New, monospace" font-size="11">device-&gt;allocateMemory(size, &amp;gpu_ptr);</text><text x="120" y="610" fill="#333" font-family="Courier New, monospace" font-size="11">device-&gt;launchKernel(kernel_func, grid_size, block_size);</text><text x="120" y="625" fill="#333" font-family="Courier New, monospace" font-size="11">device-&gt;synchronize();</text><text x="120" y="640" fill="#333" font-family="Courier New, monospace" font-size="11">device-&gt;freeMemory(gpu_ptr);</text></g><g><text x="500" y="690" fill="#333" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">关键特性：透明性 • 可移植性 • 高性能 • 易扩展</text></g></svg>