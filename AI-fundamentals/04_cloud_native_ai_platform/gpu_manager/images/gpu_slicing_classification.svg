ns-serif" font-size="10">• 延迟低，性能稳定</text><rect width="200" height="120" x="520" y="310" fill="#FFF3E0" stroke="#FF9800" stroke-width="1" rx="5"/><text x="620" y="330" fill="#E65100" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">混合切分特性</text><text x="530" y="350" fill="#333" font-family="Arial, sans-serif" font-size="10">• 灵活性最高</text><text x="530" y="365" fill="#333" font-family="Arial, sans-serif" font-size="10">• 复杂度较高</text><text x="530" y="380" fill="#333" font-family="Arial, sans-serif" font-size="10">• 适应性强</text><text x="530" y="395" fill="#333" font-family="Arial, sans-serif" font-size="10">• 性能优化潜力大</text><text x="530" y="410" fill="#333" font-family="Arial, sans-serif" font-size="10">• 管理开销适中</text></g><g><text x="400" y="470" fill="#333" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">典型应用场景</text><rect width="200" height="80" x="80" y="485" fill="#F1F8E9" stroke="#4CAF50" stroke-width="1" rx="5"/><text x="180" y="505" fill="#2E7D32" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">时间切分应用</text><text x="90" y="520" fill="#333" font-family="Arial, sans-serif" font-size="10">• 云计算平台</text><text x="90" y="535" fill="#333" font-family="Arial, sans-serif" font-size="10">• 开发测试环境</text><text x="90" y="550" fill="#333" font-family="Arial, sans-serif" font-size="10">• 批处理任务</text><rect width="200" height="80" x="300" y="485" fill="#E8F4FD" stroke="#2196F3" stroke-width="1" rx="5"/><text x="400" y="505" fill="#1565C0" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">空间切分应用</text><text x="310" y="520" fill="#333" font-family="Arial, sans-serif" font-size="10">• 高性能计算</text><text x="310" y="535" fill="#333" font-family="Arial, sans-serif" font-size="10">• 实时推理服务</text><text x="310" y="550" fill="#333" font-family="Arial, sans-serif" font-size="10">• 安全隔离场景</text><rect width="200" height="80" x="520" y="485" fill