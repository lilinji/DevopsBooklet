="2" rx="10"/><text x="170" y="355" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="bold">内核态虚拟化层</text><text x="170" y="375" fill="#fff" font-family="Arial, sans-serif" font-size="12">通过修改或拦截GPU驱动程序实现资源管理</text><text x="170" y="395" fill="#fff" font-family="Arial, sans-serif" font-size="12">• 系统级控制 • 精细资源管理 • 需要内核模块支持</text><rect width="100" height="30" x="420" y="345" fill="#E3F2FD" stroke="#2196F3" stroke-width="1" rx="5"/><text x="470" y="365" fill="#333" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">NVIDIA vGPU</text><rect width="100" height="30" x="540" y="345" fill="#E3F2FD" stroke="#2196F3" stroke-width="1" rx="5"/><text x="590" y="365" fill="#333" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Intel GVT-g</text><rect width="100" height="30" x="660" y="345" fill="#E3F2FD" stroke="#2196F3" stroke-width="1" rx="5"/><text x="710" y="365" fill="#333" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">内核模块拦截</text><rect width="100" height="30" x="780" y="345" fill="#E3F2FD" stroke="#2196F3" stroke-width="1" rx="5"/><text x="830" y="365" fill="#333" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Hypervisor</text><rect width="800" height="80" x="150" y="460" fill="url(#hardwareGrad)" stroke="#45a049" stroke-width="2" rx="10"/><text x="170" y="485" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="bold">硬件级虚拟化层</text><text x="170" y="505" fill="#fff" font-family="Arial, sans-serif" font-size="12">利用GPU硬件内置虚拟化功能实现资源隔离</text><text x="170" y="525" fill="#fff" font-family="Arial, sans-serif" font-size="12">• 硬件级隔离 • 性能开销最小 • 安全性最高</text><rect width="100" height="30" x="420" y="475" fill="#E8F5E8" stroke="#4CAF50" stroke-width="1" rx="5"/><text x="470" y="495" fill="#333" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">NVIDIA MIG</text><rect width="100" height="30" x="540" y="475" fill="#E8F5E8" stroke="#4CAF50" stroke-width="