end="url(#arrowhead)" d="M 960 140 L 960 190"/><path fill="none" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)" d="M 960 250 L 960 280"/><path fill="none" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)" d="M 960 340 L 960 370"/><path fill="none" stroke="#e74c3c" stroke-dasharray="5 5" stroke-width="2" marker-end="url(#arrowhead)" d="M 900 405 L 200 405 L 200 230"/><path fill="none" stroke="#e74c3c" stroke-dasharray="5 5" stroke-width="2" marker-end="url(#arrowhead)" d="M 900 405 L 320 405 L 320 230"/><path fill="none" stroke="#e74c3c" stroke-dasharray="5 5" stroke-width="2" marker-end="url(#arrowhead)" d="M 900 405 L 440 405 L 440 230"/><defs><marker id="arrowhead" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="#2c3e50" points="0 0 10 3.5 0 7"/></marker></defs><text x="50" y="500" fill="#7f8c8d" font-family="Arial, sans-serif" font-size="12">• 主流程：用户输入 → 多策略检索 → 上下文构建 → LLM 推理 → 响应生成 → 用户反馈</text><text x="50" y="520" fill="#7f8c8d" font-family="Arial, sans-serif" font-size="12">• 记忆层：短期记忆、中期记忆、长期记忆水平排列，多策略检索可直接访问</text><text x="50" y="540" fill="#7f8c8d" font-family="Arial, sans-serif" font-size="12">• 更新流程：由用户反馈触发，包括记忆质量评估、个性化学习和智能记忆更新</text></svg>